<!DOCTYPE html>
<html lang="en" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به چاکود</title>
    <!-- ========================= -->
    <!-- CSS LINKS -->
    <!-- ========================= -->
    <link rel="stylesheet" href="../sliders/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="apple-touch-icon" href="../assets/logo/chakod.png" />
  </head>
  <body class="full-page-height full-width">
    <div
      class="full-width full-height flex row align-items-stretch lg-block"
    >
      <!-- Form -->
      <div
        class="flex column  align-items-center full-height fill bg-background md-pl-5 md-pr-5"
      >
        <div class="flex column full-width max-w-50 my-auto pt-5 pb-5">
          <!-- Login and signup -->
          <form
            class="flex column justify-content-center align-items-center full-height"
          >
            <img src="https://placehold.co/800x237" alt="لوگو شاپی" class="w-8" />
            <h1 class="font-peyda mb-4 mt-1 text-xl">ورود به حساب کاربری</h1>
            <div
              class="flex row justify-content-center align-items-center font gap-3 mb-10"
            >
              <button class="btn-secondary font-peyda text-sm md-text-xs">
                ورود با پیامک
              </button>
              <button
                class="btn-secondary font-peyda btn-secondary-active text-sm md-text-xs"
              >
                ورود با رمز عبور
              </button>
            </div>
            <div
              class="flex align-items-center justify-content-center column gap-3 full-width"
            >
              <input
                type="number"
                placeholder="شماره تلفن همراه"
                class="input input-primary font-peyda full-width text-xs"
              />
              <input
                type="password"
                placeholder="رمز عبور"
                class="input input-primary font-peyda full-width text-xs"
              />
            </div>
            <a href="#" class="full-width font-peyda text-xs text-primary mt-4"
              >رمز عبور خود را فراموش کرده اید؟</a
            >
            <button class="btn-primary font-peyda full-width mt-4">
              ورود به چاکود
            </button>
          </form>
          <!-- Ads -->
           <div class="flex justify-content-center align-items-center overflow-hidden full-height">
          <div class="swiper login-ad-swiper mt-6">
            <div class="swiper-wrapper full-height">
              <div class="swiper-slide full-height">
                <a
                  href="#"
                  class="full-width"
                >
                <img src="https://placehold.co/800x267" class="full-width" alt="">
                </a>
              </div>
              <div class="swiper-slide">
                <a
                  href="#"
                  class=""
                >
                <img src="https://placehold.co/800x267" class="full-width " alt="">
                </a>
              </div>
              <div class="swiper-slide">
                <a
                  href="#"
                  class=""
                >
                <img src="https://placehold.co/800x267" class="full-width " alt="">
                </a>
              </div>
            </div>
            <div class="swiper-pagination lg-remove"></div>
          </div>
        </div>
        </div>
      </div>
      <!-- Left Banner -->
      <div class="flex full-height fill bg-background lg-remove">
        <div id="login-banner" class="full-width"></div>
      </div>
    </div>
    <!-- ========================= -->
    <!-- JS SCRIPTS -->
    <!-- ========================= -->
    <script src="../sliders/swiper-bundle.min.js"></script>
    <script src="../sliders/swiper-sliders.js"></script>
  </body>
</html>
